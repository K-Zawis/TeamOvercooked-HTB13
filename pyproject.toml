[project]
name = "team-overcooked-htb13"
version = "0.1.0"
description = "Streaming TIFF depth extraction and Redis task processing for Viridien"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.24",
    "Pillow>=10.1",
    "pydantic>=2.10",
    "psutil>=5.9",
    "rasterio>=1.3",
    "tifffile>=2025.5.21",
    "zarr>=3",
    "imagecodecs>=2024.12.30",
    "redis>=5",
    "uvicorn>=0.34",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "fakeredis[lua]>=2.26",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
