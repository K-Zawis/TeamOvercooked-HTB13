services:
  redis:
    image: redis:7-alpine
    container_name: well_log_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dispatcher:
    image: well_log_dispatcher
    container_name: well_log_dispatcher
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SLICE_HEIGHT=2000
      - BATCH_SIZE=5
      - DATA_DIR=/data
      - OUTPUT_DIR=/output
    volumes:
      - ./dataset:/data:ro
      - ./output:/output
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    command: python -m src.dispatcher

